<!DOCTYPE html>

<head>

    <title>Dashboard Analisis PBD - SK Satu Sultan Alam Shah</title>
    
    <!-- Tailwind CSS -->

    <!-- Chart.js -->

    <!-- Google Fonts: Inter -->

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* slate-50 */
        }
        .card {
            background-color: white;
            border-radius: 0.75rem; /* rounded-xl */
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); /* shadow-md */
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1); /* shadow-lg */
        }
        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }
        .tab-button {
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
        }
        .tab-button.active {
            border-bottom-color: #4f46e5; /* indigo-600 */
            color: #312e81; /* indigo-900 */
            font-weight: 600;
        }
        .subject-tab-content, .year-tab-content {
            display: none;
        }
        .subject-tab-content.active, .year-tab-content.active {
            display: block;
        }
    </style>
</head>

        };
        const dataBi = {

        // --- DYNAMIC CONTENT GENERATION ---
        function createYearlyAnalysis(subject, dataObject, tabsContainer, contentContainer, chartTitlePrefix, titleColor) {
            tabsContainer.innerHTML = '';
            contentContainer.innerHTML = '';
            Object.keys(dataObject).forEach((key, index) => {
                const year = key.replace('tahun', '');
                const data = dataObject[key];
                const isActive = index === 0;

                const tabButton = document.createElement('button');
                tabButton.className = `tab-button year-tab-button py-3 px-5 text-sm font-medium text-center text-gray-500 ${isActive ? 'active' : ''}`;
                tabButton.textContent = `Tahun ${year}`;
                tabButton.dataset.parent = `content-${subject}`;
                tabButton.dataset.target = `${subject}-tahun${year}`;
                tabsContainer.appendChild(tabButton);

                let isuContent = '';
                const createIsuCard = (tpLevel, count, issueText, intPendek, intPanjang, color) => {
                    if (count > 0) {
                        return `<div class="bg-${color}-50 border-l-4 border-${color}-500 p-4 rounded-r-lg">
                                    <h4 class="font-bold text-${color}-800">Isu: ${tpLevel} (${count} Murid)</h4>
                                    <p class="text-sm mt-1">${issueText}</p>
                                    <div class="mt-3 pt-3 border-t text-sm text-gray-700 space-y-2">
                                        <div><p class="font-semibold">Jangka Pendek:</p><ul class="list-disc list-inside pl-4">${intPendek}</ul></div>
                                        <div><p class="font-semibold">Jangka Panjang:</p><ul class="list-disc list-inside pl-4">${intPanjang}</ul></div>
                                    </div>
                                </div>`;
                    }
                    return '';
                };
                
                const tp1_2_count = data.tp[0] + data.tp[1];
                isuContent += createIsuCard('TP1 & TP2', tp1_2_count, data.isu_tp1_2 || data.isu_tp1 || '', data.int_pendek_12 || data.int_pendek_1 || '', data.int_panjang_12 || data.int_panjang_1 || '', 'orange');
                isuContent += createIsuCard('TP3', data.tp[2], data.isu_tp3 || '', data.int_pendek_3 || '', data.int_panjang_3 || '', 'yellow');
                isuContent += createIsuCard('TP4', data.tp[3], data.isu_tp4 || '', data.int_pendek_4 || '', data.int_panjang_4 || '', 'lime');

                const contentDiv = document.createElement('div');
                contentDiv.id = `${subject}-tahun${year}`;
                contentDiv.className = `year-tab-content ${isActive ? 'active' : ''}`;
                contentDiv.innerHTML = `

        // Generate content for Sejarah
        const sejYearContentContainer = document.getElementById('sej-year-content');
        sejYearContentContainer.innerHTML = `
            <div id="sej-tahun4" class="year-tab-content active"><div class="space-y-6"><div><h3 class="text-lg font-semibold mb-2 text-center text-sky-800">Taburan TP Sejarah Tahun 4</h3><div class="chart-container"><canvas id="chartSejTahun4"></canvas></div></div><div class="grid grid-cols-1 md:grid-cols-2 gap-6"><div class="bg-orange-50 border-l-4 border-orange-500 p-4 rounded-r-lg"><h4 class="font-bold text-orange-800">Isu: TP1 & TP2 (1 Murid)</h4><p class="text-sm mt-1">Kehadiran tidak konsisten, tidak melengkapkan tugasan, dan kurang mahir kemahiran asas Sejarah.</p><div class="mt-3 pt-3 border-t text-sm text-gray-700 space-y-2"><div><p class="font-semibold">Jangka Pendek:</p><ul class="list-disc list-inside pl-4"><li>Sesi perbincangan bersama murid dan ibu bapa untuk memahami punca ketidakhadiran.</li><li>Bimbingan individu dan tugasan ringkas secara berperingkat.</li></ul></div><div><p class="font-semibold">Jangka Panjang:</p><ul class="list-disc list-inside pl-4"><li>Melibatkan murid dalam pembelajaran berasaskan projek untuk meningkatkan minat.</li></ul></div></div></div><div class="bg-yellow-50 border-l-4 border-yellow-500 p-4 rounded-r-lg"><h4 class="font-bold text-yellow-800">Isu: TP3 (41 Murid)</h4><p class="text-sm mt-1">Penguasaan sederhana, faham sebahagian kandungan tetapi sukar dalam aspek tertentu. Perlu sokongan ke TP4.</p><div class="mt-3 pt-3 border-t text-sm text-gray-700 space-y-2"><div><p class="font-semibold">Jangka Pendek:</p><ul class="list-disc list-inside pl-4"><li>Sesi pengajaran berfokus pada topik lemah.</li><li>Latihan bertema berterusan menggunakan peta minda atau permainan interaktif.</li></ul></div><div><p class="font-semibold">Jangka Panjang:</p><ul class="list-disc list-inside pl-4"><li>Program mentor-mentee di mana murid cemerlang membantu rakan.</li><li>Melibatkan ibu bapa dalam pemantauan pembelajaran di rumah.</li></ul></div></div></div></div></div></div>
            <div id="sej-tahun5" class="year-tab-content"><div class="space-y-6"><div><h3 class="text-lg font-semibold mb-2 text-center text-amber-800">Taburan TP Sejarah Tahun 5</h3><div class="chart-container"><canvas id="chartSejTahun5"></canvas></div></div><div class="grid grid-cols-1 md:grid-cols-2 gap-6"><div class="bg-orange-50 border-l-4 border-orange-500 p-4 rounded-r-lg"><h4 class="font-bold text-orange-800">Isu: TP1 & TP2 (3 Murid)</h4><p class="text-sm mt-1">Kehadiran tidak konsisten, tidak melengkapkan tugasan, dan kurang mahir kemahiran asas Sejarah.</p><div class="mt-3 pt-3 border-t text-sm text-gray-700 space-y-2"><div><p class="font-semibold">Jangka Pendek:</p><ul class="list-disc list-inside pl-4"><li>Bimbingan individu atau dalam kumpulan kecil.</li><li>Menyediakan bahan tambahan seperti video pembelajaran atau buku latihan mudah.</li></ul></div><div><p class="font-semibold">Jangka Panjang:</p><ul class="list-disc list-inside pl-4"><li>Mewujudkan sistem pemantauan tugasan bersama ibu bapa melalui aplikasi komunikasi.</li></ul></div></div></div><div class="bg-yellow-50 border-l-4 border-yellow-500 p-4 rounded-r-lg"><h4 class="font-bold text-yellow-800">Isu: TP3 (5 Murid)</h4><p class="text-sm mt-1">Menguasai sebahagian kandungan tetapi lemah dalam aplikasi pengetahuan.</p><div class="mt-3 pt-3 border-t text-sm text-gray-700 space-y-2"><div><p class="font-semibold">Jangka Pendek:</p><ul class="list-disc list-inside pl-4"><li>Mengadakan Klinik Sejarah mingguan untuk topik sukar.</li><li>Menggunakan kuiz interaktif (cth: Kahoot, Quizziz) untuk meningkatkan penglibatan.</li></ul></div><div><p class="font-semibold">Jangka Panjang:</p><ul class="list-disc list-inside pl-4"><li>Melaksanakan program mentor rakan sebaya.</li></ul></div></div></div></div></div></div>

        createYearlyAnalysis('bi', dataBi, document.getElementById('bi-year-tabs'), document.getElementById('bi-year-content'), 'Taburan TP BI', 'text-green-800');

        // --- TAB FUNCTIONALITY ---
        function setupTabSwitching(buttonSelector, contentSelector) {
            const tabs = document.querySelectorAll(buttonSelector);
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    const parentId = tab.dataset.parent;
                    const targetId = tab.dataset.target;
                    document.querySelectorAll(`${buttonSelector}[data-parent="${parentId}"]`).forEach(t => t.classList.remove('active'));
                    document.querySelectorAll(`#${parentId} .year-tab-content`).forEach(c => c.classList.remove('active'));
                    tab.classList.add('active');
                    document.getElementById(targetId).classList.add('active');
                });
            });
        }

        const subjectTabs = document.querySelectorAll('.subject-tab-button');
        const subjectContents = document.querySelectorAll('.subject-tab-content');
        subjectTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                // Animate count-up only when switching to Sejarah tab
                if(tab.dataset.target === 'content-sej') {
                    document.querySelectorAll('#content-sej .count-up').forEach(el => {
                        animateCountUp(el);
                    });
                }
                subjectTabs.forEach(t => t.classList.remove('active'));
                subjectContents.forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.target).classList.add('active');
            });
        });

        setupTabSwitching('.year-tab-button', '.year-tab-content');

        // Count-up animation function
        function animateCountUp(el) {
            const finalValue = parseInt(el.dataset.value, 10);
            let currentValue = 0;
            const duration = 1500;
            const increment = finalValue / (duration / 16);
            function updateCount() {
                currentValue += increment;
                if (currentValue < finalValue) {
                    el.textContent = Math.ceil(currentValue);
                    requestAnimationFrame(updateCount);
                } else {
                    el.textContent = finalValue;
                }
            }
            requestAnimationFrame(updateCount);
        }

        // --- CHART RENDERING ---
        const commonChartOptions = { responsive: true, maintainAspectRatio: false, animation: { duration: 1000, easing: 'easeInOutQuart' }, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, title: { display: true, text: 'Bilangan Murid' } } } };
        const chartLabels = ['TP1', 'TP2', 'TP3', 'TP4', 'TP5', 'TP6'];
        const chartColors = ['#ef4444', '#f97316', '#f59e0b', '#84cc16', '#22c55e', '#10b981'];

        Object.keys(dataBm).forEach(key => { new Chart(document.getElementById(`chartBmTahun${key.replace('tahun','')}`).getContext('2d'), { type: 'bar', data: { labels: chartLabels, datasets: [{ data: dataBm[key].tp, backgroundColor: chartColors, borderRadius: 4 }] }, options: commonChartOptions }); });
        Object.keys(dataSej).forEach(key => { new Chart(document.getElementById(`chartSejTahun${key.replace('tahun','')}`).getContext('2d'), { type: 'bar', data: { labels: chartLabels, datasets: [{ data: dataSej[key].tp, backgroundColor: chartColors, borderRadius: 4 }] }, options: commonChartOptions }); });
        Object.keys(dataSains).forEach(key => { new Chart(document.getElementById(`chartSainsTahun${key.replace('tahun','')}`).getContext('2d'), { type: 'bar', data: { labels: chartLabels, datasets: [{ data: dataSains[key].tp, backgroundColor: chartColors, borderRadius: 4 }] }, options: commonChartOptions }); });
        Object.keys(dataBi).forEach(key => { new Chart(document.getElementById(`chartBiTahun${key.replace('tahun','')}`).getContext('2d'), { type: 'bar', data: { labels: chartLabels, datasets: [{ data: dataBi[key].tp, backgroundColor: chartColors, borderRadius: 4 }] }, options: commonChartOptions }); });

        lucide.createIcons();
    });
